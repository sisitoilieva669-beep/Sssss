<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Montserrat:wght@600;700&family=Marck+Script&display=block&subset=cyrillic" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1080px;background:#000}
.b{position:relative;width:1080px;height:1080px;overflow:hidden;background:url(banner-bg.png) center/cover}
.b:after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.08) 0%,rgba(0,0,0,0) 35%,rgba(0,0,0,0) 62%,rgba(0,0,0,.38) 100%);pointer-events:none}
.kick{position:absolute;top:52px;width:100%;text-align:center;font:400 74px 'Marck Script',cursive;color:#fff;text-shadow:0 3px 14px rgba(0,40,80,.45);z-index:2}
.h{position:absolute;top:128px;width:100%;text-align:center;font:700 238px/1 'Oswald',sans-serif;color:#fff;letter-spacing:6px;text-shadow:0 8px 30px rgba(0,40,90,.35);z-index:2}
.price{position:absolute;left:52px;top:828px;color:#fff;font:600 34px 'Montserrat',sans-serif;text-shadow:0 2px 10px rgba(0,0,0,.55);z-index:2}
.price b{font:700 70px 'Montserrat',sans-serif;letter-spacing:-1px}
.bar{position:absolute;left:46px;top:936px;width:830px;height:98px;border-radius:20px;background:#0b5a6e;display:flex;align-items:center;justify-content:space-between;padding:0 30px;color:#fff;font:600 27px 'Montserrat',sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:2}
.it{display:flex;align-items:center;gap:12px;white-space:nowrap;flex:none}
.it svg{width:36px;height:36px;flex:none}
.sep{width:2px;height:48px;flex:none;background:rgba(255,255,255,.55)}
.logo{position:absolute;left:893px;top:862px;width:150px;z-index:2;filter:drop-shadow(0 2px 6px rgba(0,0,0,.35))}
</style></head><body><div class="b">
<div class="kick">Ранни записвания</div>

<div class="bar">
 <div class="it"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M7.5 14h.01M12 14h.01M16.5 14h.01M7.5 17.5h.01M12 17.5h.01"/></svg>Сезон 2027</div>

 <div class="sep"></div>
 <div class="it"><svg viewBox="0 0 24 24" fill="#fff"><path d="M21 15.5v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V8.5l-8 5v2l8-2.5V18l-2 1.5V21l3.5-1 3.5 1v-1.5L13 18v-5z"/></svg>Полет от София</div>
